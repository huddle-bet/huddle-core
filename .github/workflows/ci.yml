name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The @huddle-bet/core dep is pinned as git+ssh in package-lock.json and
      # Actions has no SSH key. huddle-core is a public repo, so rewriting to
      # HTTPS resolves it without needing a deploy key.
      - name: Use HTTPS for GitHub git deps
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check-types

      # dist/ is committed, not built on install — consumers resolve this
      # package straight from the repo via `github:huddle-bet/huddle-core`.
      # Nothing otherwise stops src and dist drifting, and when they do the
      # services silently import stale code. Rebuild and fail if the result
      # differs from what was committed.
      - name: dist is up to date with src
        run: |
          npm run build
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

      # --if-present: huddle-data and huddle-odds have no suite yet. This is a
      # placeholder that starts working the moment one is added, rather than a
      # green check that silently proves nothing.
      - name: Test
        run: npm test --if-present
