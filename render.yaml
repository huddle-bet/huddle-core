envVarGroups:
  - name: huddle-shared
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: WHOP_API_KEY
        sync: false
      - key: WHOP_CLIENT_ID
        sync: false
      - key: WHOP_CLIENT_SECRET
        sync: false
      - key: WHOP_REDIRECT_URI
        sync: false
      - key: HUDDLE_INTERNAL_SECRET
        sync: false
      - key: HUDDLE_LIVE_URL
        sync: false
      # FlareSolverr URL — consumed only by huddle-data, and only for the
      # /stats/matches/* HLTV path during backfill (CS2 per-map player
      # stats). Every other HLTV fetch goes through cycletls + the
      # residential proxy below. Kept in the shared group for blueprint
      # simplicity; nothing else reads it.
      - key: FLARESOLVERR_URL
        sync: false
      # Residential / non-banned HTTP(S) proxy pool for HLTV traffic.
      # Render's datacenter ranges are hard-blocked by Cloudflare for
      # hltv.org ("Sorry, you have been blocked"). Two consumers:
      #   - cycletls (huddle-data + huddle-live HTML scrapers + polling
      #     scorebot) — pins one URL from the pool per process and keeps
      #     it for cookie/IP affinity. CF's __cf_bm cookie is IP-bound.
      #   - FlareSolverr — passes the same URL through as `proxy.url` on
      #     the /stats solve.
      # Format: comma-separated list of `http://user:pass@host:port` —
      # one entry per sticky exit IP. Single bare URL also works for the
      # static-IP case. `{session}` token in the URL is substituted with
      # a random value at process start for sticky-session proxies.
      - key: FLARESOLVERR_PROXY_URL
        sync: false
      # HLTV scorebot transport selector — consumed only by huddle-live's
      # HltvAdapter at fixture spawn time:
      #   - 'polling' (or unset): cycletls Engine.IO long-poll. Lightweight
      #     but tops out at ~75-85% live coverage because Cloudflare
      #     silent-blocks ~25% of long-poll sessions post-handshake.
      #   - 'headless':           Playwright Chromium holds a real browser
      #     session per match. ~95-98% coverage but ~100-150MB RAM per
      #     concurrent match. Requires huddle-live on standard plan or
      #     larger so 5-10 concurrent matches fit. See huddle-live below.
      - key: HLTV_TRANSPORT
        sync: false

services:
  # ── huddle-api (Web Service) ──────────────────────────────
  - type: web
    name: huddle-api
    runtime: node
    region: oregon
    plan: free
    repo: https://github.com/huddle-bet/huddle-api
    buildCommand: npm install
    startCommand: node --import tsx src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - fromGroup: huddle-shared

  # ── huddle-odds (Background Worker — Docker) ─────────────
  # Consolidated from huddle-odds-sports + huddle-odds-esports — per-league
  # per-book pollers run independently on their own timers (see poller.ts),
  # so one process handles all 10 leagues without contention. Saves a full
  # standard-plan worker instance.
  - type: worker
    name: huddle-odds
    runtime: docker
    region: oregon
    plan: standard
    repo: https://github.com/huddle-bet/huddle-odds
    dockerfilePath: ./Dockerfile
    dockerCommand: node --max-old-space-size=3800 --import tsx src/cli.ts poll nba nhl mlb ncaam cs2 lol valorant dota2 cod rl
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: huddle-shared

  # ── huddle-data (Background Worker — Docker) ─────────────
  # Schedule + live-poll path only. Reconciler walks (blast/breakingpoint
  # tournament walks, vlr per-page scrapes, OpenDota fallback buffers, Go
  # replay parser invocations) live in huddle-reconciler below. They were
  # sharing one ~512MB container budget and OOM'ing every ~5 min, killing
  # in-flight walks before they could finish — split into two starter
  # workers ($14/mo total, vs $25/mo to upgrade one to standard) so each
  # gets its own RSS budget.
  - type: worker
    name: huddle-data
    runtime: docker
    region: oregon
    plan: starter
    repo: https://github.com/huddle-bet/huddle-data
    dockerfilePath: ./Dockerfile
    dockerCommand: node --max-old-space-size=512 --import tsx src/cli.ts worker --mode=schedule
    envVars:
      - key: NODE_ENV
        value: production
      # Use Byparr (Camoufox/Firefox) instead of FlareSolverr (Chromium)
      # for the Tier 2 /stats solve path. The flaresolverr Render
      # service's image was swapped to ghcr.io/thephaseless/byparr:latest
      # — same port, same FlareSolverr-shape REST API, but no session
      # lifecycle and maxTimeout in seconds. byparr-client.ts handles
      # the protocol differences. Remove this env to revert to the
      # original FlareSolverr code path.
      - key: BYPARR_MODE
        value: "true"
      - fromGroup: huddle-shared

  # ── huddle-reconciler (Background Worker — Docker) ───────
  # Post-game reconcile path: 7 unfilled sweeps (blast, breakingpoint,
  # lolesports, vlr, hltv, valve-dota, r6) + the Reconciler retry loop
  # with all 9 adapter registrations. Same repo + Dockerfile as
  # huddle-data; only the start command differs (--mode=reconciler).
  # Communicates with huddle-data exclusively via Supabase (events,
  # game_summaries, player_game_stats, reconcile_dead_letters) — no IPC.
  #
  # Memory profile dominated by cheerio DOM trees from blast.tv +
  # breakingpoint.gg + vlr.gg per-page scrapes during walks, plus the
  # OpenDota /matches/{id} response buffers when Valve GetMatchDetails
  # is 5xx-down. Sized at starter (512MB RSS); --max-old-space-size=512
  # pins V8's heap cap to the container limit.
  - type: worker
    name: huddle-reconciler
    runtime: docker
    region: oregon
    plan: starter
    repo: https://github.com/huddle-bet/huddle-data
    dockerfilePath: ./Dockerfile
    dockerCommand: node --max-old-space-size=512 --import tsx src/cli.ts worker --mode=reconciler
    envVars:
      - key: NODE_ENV
        value: production
      # See huddle-data above — same Byparr-via-flaresolverr-port story.
      # huddle-reconciler hits HLTV's /stats path during cs2 walks.
      - key: BYPARR_MODE
        value: "true"
      - fromGroup: huddle-shared

  # ── huddle-engine (Background Worker) ────────────────────
  # Standard plan (2 CPU / 4 GB) — upgraded from starter (0.5 CPU) after
  # production metrics showed CPU pegged at 60-100% with the 0.5 cap
  # throttling projection refresh cycles. With per-league worker pool +
  # bounded odds queries, CPU headroom was the last blocker.
  - type: worker
    name: huddle-engine
    runtime: node
    region: oregon
    plan: standard
    repo: https://github.com/huddle-bet/huddle-engine
    buildCommand: npm install
    startCommand: node --max-old-space-size=3800 --import tsx src/cli.ts worker
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: huddle-shared

  # ── huddle-live (Web Service — exposes fanout WS) ─────────
  # Flipped from worker → web so huddle-api can open an internal WS to
  # /fanout. Realtime broadcast was the #1 Supabase message-cost driver;
  # this replaces it with a direct service-to-service WS. Auth via
  # HUDDLE_INTERNAL_SECRET header — not meant for browser clients.
  #
  # Plan: standard (1 CPU / 2 GB) — required by the headless Chromium
  # scorebot transport. With per-context memory tuned to ~100-130MB
  # (resource blocking + --max-old-space-size=192) the worker fits 5-7
  # concurrent CS2 matches plus the base node process under 2GB. Polling
  # transport alone runs comfortably on starter; standard is sized for
  # HLTV_TRANSPORT=headless. Drop back to starter if reverting.
  - type: web
    name: huddle-live
    runtime: node
    region: oregon
    plan: standard
    repo: https://github.com/huddle-bet/huddle-live
    # Explicitly run `playwright install` after npm install. The package's
    # postinstall hook normally handles this, but if it ever silently
    # fails the headless transport crashes on launch with "Executable
    # doesn't exist" — observed 2026-04-29 16:52 UTC. Belt-and-suspenders.
    buildCommand: npm install && npx playwright install chromium --only-shell
    startCommand: node --import tsx src/cli.ts watch --all
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8081"
      # Memory canary cap for the headless transport's per-minute
      # `[headless-scorebot] mem rss=...` log. Keep aligned with the
      # service plan's actual RAM ceiling.
      - key: PLAN_RAM_MB
        value: "2048"
      # Note: PLAYWRIGHT_BROWSERS_PATH=0 is defaulted in code (see
      # headless-scorebot-client.ts top-of-file). Render's build artifact
      # preserves node_modules but not ~/.cache, so browsers must live
      # inside the project directory to survive build → runtime. Set this
      # env here only to override (e.g. external browser cache mount).
      # huddle-live no longer hits FlareSolverr — the polling scorebot
      # and matches-harvester both go via cycletls + residential proxy.
      # FLARESOLVERR_URL is inherited from the shared group but unused.
      - fromGroup: huddle-shared

  # ── FlareSolverr (Private Service — pre-built image) ──────
  # Cloudflare JS-challenge solver. Sole remaining caller is huddle-data's
  # CS2 backfill — specifically the /stats/matches/mapstatsid/* path,
  # which CF gates more strictly than the rest of www.hltv.org and
  # rejects cycletls + JA3 + cookies. All other HLTV traffic (live
  # ingest, /matches harvest, /results, match detail) now goes through
  # cycletls and never touches this service.
  #
  # pserv = private service, no external ingress. Only reachable from
  # other Render services in the same workspace via http://flaresolverr:8191.
  #
  # runtime=image + image.url pulls the official upstream build.
  #
  # Starter plan (0.5 CPU / 512 MB) — downgraded from standard now that
  # FlareSolverr is no longer in the live ingest hot path. Backfill runs
  # /stats sequentially (~once per map, paced 2s+) so at most one
  # Chromium tab is open at a time. The historical OOM that forced
  # standard plan was driven by concurrent live-ingest tabs — that load
  # is gone. Saves ~$18/mo vs standard.
  - type: pserv
    name: flaresolverr
    runtime: docker
    region: oregon
    plan: starter
    # Migrated 2026-04-28 from upstream FlareSolverr (vanilla Chromium,
    # effectively unmaintained) to Byparr — FlareSolverr-API-compatible
    # REST backed by Camoufox (patched Firefox with C-level anti-
    # fingerprint). Different browser stack from any Chromium variant.
    #
    # We wrap Byparr's image with a tiny entrypoint at byparr-wrapper/
    # that auto-derives Byparr's PROXY_SERVER / PROXY_USERNAME /
    # PROXY_PASSWORD from FLARESOLVERR_PROXY_URL (the existing CSV pool
    # of Webshare residential IPs in huddle-shared). Picks the first
    # entry deterministically so this container's egress IP matches the
    # one huddle-data's cycletls process pins to — required for
    # cf-session cache reuse, since cf_clearance is bound to source IP.
    #
    # Service name kept as 'flaresolverr' so FLARESOLVERR_URL doesn't
    # need to change across consumers. Revert: change runtime back to
    # image / image.url, remove BYPARR_MODE on huddle-data.
    repo: https://github.com/huddle-bet/huddle-core
    dockerfilePath: ./byparr-wrapper/Dockerfile
    dockerContext: ./byparr-wrapper
    envVars:
      - key: PORT
        value: "8191"
      # Inherits FLARESOLVERR_PROXY_URL — the entrypoint script parses
      # it and exports PROXY_SERVER / PROXY_USERNAME / PROXY_PASSWORD
      # before launching Byparr.
      - fromGroup: huddle-shared
