envVarGroups:
  - name: huddle-shared
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: WHOP_API_KEY
        sync: false
      - key: WHOP_CLIENT_ID
        sync: false
      - key: WHOP_CLIENT_SECRET
        sync: false
      - key: WHOP_REDIRECT_URI
        sync: false
      - key: GSK_TOKEN
        sync: false
      - key: HUDDLE_INTERNAL_SECRET
        sync: false
      - key: HUDDLE_LIVE_URL
        sync: false

services:
  # ── huddle-api (Web Service) ──────────────────────────────
  - type: web
    name: huddle-api
    runtime: node
    region: oregon
    plan: free
    repo: https://github.com/huddle-bet/huddle-api
    buildCommand: npm install
    startCommand: node --import tsx src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - fromGroup: huddle-shared

  # ── huddle-odds (Background Worker — Docker) ─────────────
  # Consolidated from huddle-odds-sports + huddle-odds-esports — per-league
  # per-book pollers run independently on their own timers (see poller.ts),
  # so one process handles all 10 leagues without contention. Saves a full
  # standard-plan worker instance.
  - type: worker
    name: huddle-odds
    runtime: docker
    region: oregon
    plan: standard
    repo: https://github.com/huddle-bet/huddle-odds
    dockerfilePath: ./Dockerfile
    dockerCommand: node --max-old-space-size=3800 --import tsx src/cli.ts poll nba nhl mlb ncaam cs2 lol valorant dota2 cod rl
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: huddle-shared

  # ── huddle-data (Background Worker — Docker) ─────────────
  - type: worker
    name: huddle-data
    runtime: docker
    region: oregon
    plan: starter
    repo: https://github.com/huddle-bet/huddle-data
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: huddle-shared

  # ── huddle-engine (Background Worker) ────────────────────
  # Standard plan (2 CPU / 4 GB) — upgraded from starter (0.5 CPU) after
  # production metrics showed CPU pegged at 60-100% with the 0.5 cap
  # throttling projection refresh cycles. With per-league worker pool +
  # bounded odds queries, CPU headroom was the last blocker.
  - type: worker
    name: huddle-engine
    runtime: node
    region: oregon
    plan: standard
    repo: https://github.com/huddle-bet/huddle-engine
    buildCommand: npm install
    startCommand: node --max-old-space-size=3800 --import tsx src/cli.ts worker
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: huddle-shared

  # ── huddle-live (Web Service — exposes fanout WS) ─────────
  # Flipped from worker → web so huddle-api can open an internal WS to
  # /fanout. Realtime broadcast was the #1 Supabase message-cost driver;
  # this replaces it with a direct service-to-service WS. Auth via
  # HUDDLE_INTERNAL_SECRET header — not meant for browser clients.
  - type: web
    name: huddle-live
    runtime: node
    region: oregon
    plan: starter
    repo: https://github.com/huddle-bet/huddle-live
    buildCommand: npm install
    startCommand: node --import tsx src/cli.ts watch --all
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8081"
      - fromGroup: huddle-shared
      # HLTV scorebot ingest for CS2. On by default via LEAGUE_PROVIDERS.cs2
      # primary='hltv' in @huddle-bet/core, but gated in cli.ts on BOTH
      # HLTV_ENABLED=1 and FLARESOLVERR_URL set. Until both are present,
      # dispatch falls through to GSK (fallback in LEAGUE_PROVIDERS).
      # See SPEC-ESPORTS-CS2.md §Legal for operating posture.
      - key: HLTV_ENABLED
        value: "1"
      - key: FLARESOLVERR_URL
        value: http://flaresolverr:8191

  # ── FlareSolverr (Private Service — pre-built image) ──────
  # Cloudflare challenge solver. huddle-live uses it to obtain cf_clearance
  # cookies + a matching Chromium user-agent, then talks directly to
  # scorebot-lb.hltv.org / www.hltv.org with those cookies.
  #
  # pserv = private service, no external ingress. Only reachable from
  # other Render services in the same workspace via http://flaresolverr:8191.
  #
  # runtime=image + image.url pulls the official upstream build — no repo
  # or Dockerfile needed on our side. Pinned to :latest for now; repin to
  # a specific tag once we validate against a real tournament.
  #
  # Starter plan (512 MB) is tight for Chromium — a single busy session
  # sits at ~300–450 MB. Bump to `standard` (2 CPU / 4 GB) if we see
  # OOM kills during Major / IEM weekends. Cost delta: ~$18/mo.
  - type: pserv
    name: flaresolverr
    runtime: image
    region: oregon
    plan: starter
    image:
      url: ghcr.io/flaresolverr/flaresolverr:latest
    envVars:
      - key: LOG_LEVEL
        value: info
      - key: CAPTCHA_SOLVER
        value: none
      # FlareSolverr's default 60s is conservative — HLTV challenges
      # usually clear in 5–15s. 40s is the sweet spot observed in prod
      # usage across community scrapers.
      - key: BROWSER_TIMEOUT
        value: "40000"
      - key: PORT
        value: "8191"
