envVarGroups:
  - name: huddle-shared
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: HUDDLE_INTERNAL_SECRET
        sync: false
      # Stripe — the only writer of user_entitlements.is_paid (ENG-444).
      # Without STRIPE_SECRET_KEY nothing can grant Pro and every gated route
      # (/picks, /middles, /slips, /trends) 403s for real users; huddle-api
      # warns about exactly that at boot rather than serving it silently.
      # STRIPE_WEBHOOK_SECRET is the signing secret for the endpoint pointed at
      # /api/v1/webhooks/stripe — without it the webhook rejects everything.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: HUDDLE_LIVE_URL
        sync: false
      # FlareSolverr URL — consumed only by huddle-data, and only for the
      # /stats/matches/* HLTV path during backfill (CS2 per-map player
      # stats). Every other HLTV fetch goes through cycletls + the
      # residential proxy below. Kept in the shared group for blueprint
      # simplicity; nothing else reads it.
      - key: FLARESOLVERR_URL
        sync: false
      # Residential / non-banned HTTP(S) proxy pool for HLTV traffic.
      # Render's datacenter ranges are hard-blocked by Cloudflare for
      # hltv.org ("Sorry, you have been blocked"). Two consumers:
      #   - cycletls (huddle-data + huddle-live HTML scrapers + polling
      #     scorebot) — pins one URL from the pool per process and keeps
      #     it for cookie/IP affinity. CF's __cf_bm cookie is IP-bound.
      #   - FlareSolverr — passes the same URL through as `proxy.url` on
      #     the /stats solve.
      # Format: comma-separated list of `http://user:pass@host:port` —
      # one entry per sticky exit IP. Single bare URL also works for the
      # static-IP case. `{session}` token in the URL is substituted with
      # a random value at process start for sticky-session proxies.
      - key: FLARESOLVERR_PROXY_URL
        sync: false
      # Webshare's proxy-list download URL. This is now the PRIMARY source of the
      # pool — every consumer fetches it hourly and falls back to the CSV above.
      #
      # Webshare rotates the endpoints under the plan and the CSV does not follow:
      # 11 of 20 rotated in nine days, twice presenting as flaky proxies and once
      # costing a measured 38% request failure rate (ENG-491, ENG-668).
      #
      # Carries a long-lived account token in the path, so it is as sensitive as the
      # CSV itself — rotate both together.
      - key: WEBSHARE_PROXY_LIST_URL
        sync: false
      # HLTV scorebot transport selector — consumed only by huddle-live's
      # HltvAdapter at fixture spawn time:
      #   - 'polling' (or unset): cycletls Engine.IO long-poll. Lightweight
      #     but tops out at ~75-85% live coverage because Cloudflare
      #     silent-blocks ~25% of long-poll sessions post-handshake.
      #   - 'headless':           Playwright Chromium holds a real browser
      #     session per match. ~95-98% coverage but ~100-150MB RAM per
      #     concurrent match. Requires huddle-live on standard plan or
      #     larger so 5-10 concurrent matches fit. See huddle-live below.
      - key: HLTV_TRANSPORT
        sync: false

services:
  # ── huddle-api (Web Service) ──────────────────────────────
  - type: web
    name: huddle-api
    runtime: node
    region: oregon
    plan: free
    repo: https://github.com/huddle-bet/huddle-api
    buildCommand: npm install
    startCommand: node --import tsx src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - fromGroup: huddle-shared

  # ── huddle-odds (Background Worker — Docker) ─────────────
  # Consolidated from huddle-odds-sports + huddle-odds-esports — per-league
  # per-book pollers run independently on their own timers (see poller.ts),
  # so one process handles every league without contention. Saves a full
  # standard-plan worker instance.
  #
  # `poll` takes no league list. It derives one from huddle-core's
  # LEAGUE_REGISTRY (ENG-432), so the deployed set and the supported set cannot
  # drift apart. They had: this command listed `ncaam`, which was removed from
  # huddle-odds on 2026-05-27 ("descope NCAA"), and `resolveLeague` throws on it
  # inside Poller's constructor. The running container survived because it was
  # started before that removal — but it could never restart, and when it stopped
  # on 2026-07-31 it stayed stopped. The list also omitted `nfl`, which has a
  # complete book-id map (ENG-423), and included `rl`, which no book carries.
  - type: worker
    name: huddle-odds
    runtime: docker
    region: oregon
    plan: standard
    repo: https://github.com/huddle-bet/huddle-odds
    dockerfilePath: ./Dockerfile
    dockerCommand: node --max-old-space-size=3800 --import tsx src/cli.ts poll
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: huddle-shared

  # ── huddle-data (Background Worker — Docker) ─────────────
  # Schedule + live-poll path only. Reconciler walks (blast/breakingpoint
  # tournament walks, vlr per-page scrapes, OpenDota fallback buffers, Go
  # replay parser invocations) live in huddle-reconciler below. They were
  # sharing one ~512MB container budget and OOM'ing every ~5 min, killing
  # in-flight walks before they could finish — split into two workers so
  # each gets its own RSS budget. (Reconciler subsequently bumped to
  # standard once the CS2 demo pipeline pushed peak RSS past 512 MB; this
  # service stays on starter — schedule polling only, peaks ~200 MB.)
  - type: worker
    name: huddle-data
    runtime: docker
    region: oregon
    plan: starter
    repo: https://github.com/huddle-bet/huddle-data
    dockerfilePath: ./Dockerfile
    dockerCommand: node --max-old-space-size=512 --import tsx src/cli.ts worker --mode=schedule
    envVars:
      - key: NODE_ENV
        value: production
      # Use Byparr (Camoufox/Firefox) instead of FlareSolverr (Chromium)
      # for the Tier 2 /stats solve path. The flaresolverr Render
      # service's image was swapped to ghcr.io/thephaseless/byparr:latest
      # — same port, same FlareSolverr-shape REST API, but no session
      # lifecycle and maxTimeout in seconds. byparr-client.ts handles
      # the protocol differences. Remove this env to revert to the
      # original FlareSolverr code path.
      - key: BYPARR_MODE
        value: "true"
      - fromGroup: huddle-shared

  # ── huddle-reconciler (Background Worker — Docker) ───────
  # Post-game reconcile path: 7 unfilled sweeps (blast, breakingpoint,
  # lolesports, vlr, hltv, valve-dota, r6) + the Reconciler retry loop
  # with all 9 adapter registrations. Same repo + Dockerfile as
  # huddle-data; only the start command differs (--mode=reconciler).
  # Communicates with huddle-data exclusively via Supabase (events,
  # game_summaries, player_game_stats, reconcile_dead_letters) — no IPC.
  #
  # Plan: standard (1 CPU / 2 GB) — upgraded from starter (512 MB) when
  # the CS2 demo pipeline (May 2026) added per-match RAR downloads. A
  # single demo pulls 140–300 MB through the streaming pipeline (Node
  # never holds the full rar after huddle-data ac61a37) and the Go
  # parser (huddle-cs2-parser) holds the decompressed .dem entity
  # tracker in RSS at 800 MB – 1.5 GB peak across BO3/BO5 maps. Concurrent
  # demos are serialized by the in-process semaphore in demo-pipeline.ts
  # (huddle-data Phase 3, ac61a37) so only one parser child is ever
  # resident.
  #
  # --max-old-space-size: lowered 1536 → 768 on 2026-05-08 because Node
  # actual heap usage is 21-90 MB at peak (observed in prod) — the 1536
  # cap was reserving 768 MB of address space that V8 never used while
  # starving the Go parser child of native budget. Two parallel parsers
  # at 14:46 UTC (demoIds 107812 + 107814 from different matches) blew
  # the 2 GB container; even after the Phase 3 semaphore brings that to
  # one parser, the doubled native headroom (~1.28 GB) is the margin
  # that lets demoinfocs-golang's tick history fit cleanly. 768 MB is
  # still 8× the observed V8 working set — plenty of slack for the
  # cheerio DOM trees from blast.tv / breakingpoint.gg / vlr.gg
  # per-page scrapes and OpenDota fallback buffers.
  - type: worker
    name: huddle-reconciler
    runtime: docker
    region: oregon
    plan: standard
    repo: https://github.com/huddle-bet/huddle-data
    dockerfilePath: ./Dockerfile
    dockerCommand: node --max-old-space-size=768 --import tsx src/cli.ts worker --mode=reconciler
    envVars:
      - key: NODE_ENV
        value: production
      # See huddle-data above — same Byparr-via-flaresolverr-port story.
      # huddle-reconciler hits HLTV's /stats path during cs2 walks.
      - key: BYPARR_MODE
        value: "true"
      - fromGroup: huddle-shared

  # ── huddle-engine (Background Worker) ────────────────────
  # Standard plan (2 CPU / 4 GB) — upgraded from starter (0.5 CPU) after
  # production metrics showed CPU pegged at 60-100% with the 0.5 cap
  # throttling projection refresh cycles. With per-league worker pool +
  # bounded odds queries, CPU headroom was the last blocker.
  - type: worker
    name: huddle-engine
    runtime: node
    region: oregon
    plan: standard
    repo: https://github.com/huddle-bet/huddle-engine
    buildCommand: npm install
    startCommand: node --max-old-space-size=3800 --import tsx src/cli.ts worker
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: huddle-shared

  # ── huddle-verify (Cron — output assertions) ─────────────
  # Asserts that the system is producing data, on a schedule. Every significant
  # defect this system has shipped reported success while producing nothing
  # usable, so nothing that watches for errors catches them.
  #
  # Concretely: on 2026-07-31 huddle-odds and huddle-engine both stopped and the
  # entire odds -> projections -> +EV path was dead for 7.5 hours. Nothing
  # reported it; the API served stale prices with HTTP 200 the whole time. It was
  # found by someone running a query by hand (ENG-462). At 15-minute cadence this
  # job would have failed within the hour.
  #
  # A failing cron is the alert — Render notifies on non-zero exit, so this needs
  # no new alerting stack. Measured 2026-08-11 rather than assumed, because this
  # line has been read both ways and reverted on the strength of it (ENG-666):
  #
  #   /v1/notification-settings/owners/tea-d70n6…   emailEnabled true,
  #                                                 notificationsToSend "failure"
  #   this service                                  notifyOnFail "default" — inherits
  #   render.com/docs/notifications                 "A cron job execution fails" is
  #                                                 a failure-level event
  #   /v1/owners/tea-d70n6…/members                 Skyler@huddle.bet, cam@huddle.bet
  #   /v1/webhooks                                  [] — no webhook, and Slack is off
  #
  # So email to those two addresses is the entire alerting surface, and it delivers.
  #
  # Until this afternoon it was delivering nothing readable. This job ended
  # `unsuccessful` on 305 of its 466 runs from 2026-08-01 — 65%, and 84 of 96 on
  # 2026-08-10 — and almost all of it was one chronic failure: `freshness:feeds`, with
  # cs2/leaders past its ceiling while its loop kept turning, which is this file's own
  # signature for a feed that runs and never succeeds. ENG-667's duplicate CS2 teams
  # went red inside that window and were found by accident a day later.
  #
  # ENG-657 fixed the cause in huddle-data#110 — the CS2 reference cycle solved once
  # per request rather than once per cycle, and was tripping over solver restarts that
  # its own request density caused. Measured 14:30 on 2026-08-11: `freshness:feeds`
  # green across 48 feed/league pairs, 76/78 assertions holding.
  #
  # What is left is the entire point of this cron. The one gated failure now is:
  #
  #     ✗ teams:duplicates  1 book-minted duplicate team(s) on the live board:
  #                         cs2 "Team Falcons" vs K27 2026-08-12
  #
  # That is ENG-666's done-when, unprompted. The assertion this job exists for is the
  # only thing making it red, on a channel finally quiet enough to carry it. Nobody had
  # to mint a test duplicate — the board produced one.
  #
  # It runs `check:gated`, not `check:output`: assertions fail today with issues open
  # (ENG-671 joinable:nfl, nulls:cs2_player_features), and a job that is red from its
  # first run is one nobody reads. The gate still prints those failures, it just does
  # not alert on them. Widen it as they close.
  #
  # db-security and dead-letters run here rather than on a daily cron of their own.
  # They are light queries against the database this job already has open, and folding
  # them in costs no notification at all — same service, same run, one email per failed
  # run either way. A separate service would have created a second failing email stream
  # that does not exist today, which is the opposite of what this issue is about. If
  # they are red they should be red on every run. Both green on 2026-08-11: 47/47 views
  # carry security_invoker, 76/76 tables have RLS, actionable dead-letter backlog 0.
  #
  # Read dead-letters with one eye open. It reports "0 of 0 unresolved" — the table is
  # empty, not merely drained of retryables, against a header describing a ~1,150-row
  # permanent floor. A check that cannot currently fail is not a passing check. This is
  # the job that will notice it refilling, and that it reads 0 today is recorded here so
  # the first non-zero run is read as news.
  #
  # Not folded in, each for a reason rather than an oversight:
  #   check:output --self-test    asserts the assertions. This repo's own code, so CI.
  #   check:projection-quality    never run against production from this workspace. Add
  #                               it once someone has seen it pass, not before.
  #
  # Free plan: one query every 15 minutes, no persistent process.
  #
  # Suspending ingestion on purpose (to control DB spend) makes this job red every
  # 15 minutes, and an alert that fires on a normal operating mode is one people
  # stop reading — the same way the old 24h ceiling survived. So declare the pause:
  #
  #     INGEST_PAUSED_UNTIL=2026-08-02T18:00:00Z
  #
  # It suppresses freshness:odds and freshness:projections until that moment, then
  # asserts normally again. There is deliberately no indefinite form — a mute
  # nobody clears is how the next outage gets missed. A lapsed window says so on
  # every run, and a malformed value does not mute at all.
  #
  # Set it on this cron when suspending huddle-odds/huddle-engine; unset it, or
  # simply let it lapse, when they come back.
  - type: cron
    name: huddle-verify
    runtime: node
    region: oregon
    # starter, not free. Render has no free plan for cron jobs, and `plan: free` here made
    # the whole blueprint invalid — `render blueprints validate` rejects it with
    # "free not a valid plan for service type cron".
    #
    # That is why huddle-verify did not exist before 2026-08-01. It was not an un-synced
    # blueprint waiting on someone to press a button; it could never have been created —
    # 0 services of type=cron_job that day, while ten other services from this same file
    # existed. An invalid entry blocks itself, not the file.
    #
    # It exists now, and the note above said otherwise for ten days after it stopped being
    # true. crn-d9n7kh5aeets73bc86tg, created 2026-08-01T22:59Z, 466 runs through
    # 2026-08-11T13:15Z.
    plan: starter
    repo: https://github.com/huddle-bet/huddle-engine
    schedule: "*/15 * * * *"
    buildCommand: npm install
    # check:gated, not check:freshness — the gate is `freshness,coverage`.
    #
    # Freshness catches a plane being *gone*. Coverage catches it running and producing
    # a fraction of its output, which is the failure mode that survives longest because
    # nothing about it looks broken: CS2 round-stat coverage sat at 58.6% of finished
    # series for a fortnight, flat, and was found by hand rather than by any check
    # (ENG-490).
    #
    # Both are green today, so widening the gate does not make this cron red on its first
    # run. That matters — a permanently red alert is one nobody reads, which is how the
    # old 24h freshness ceiling slept through a 7.5h outage.
    # The `${VAR:?}` guard is not decoration. check:gated exits 2 without a credential,
    # but the two folded in after it do this instead:
    #
    #     if (!url) { console.log('[db-security] DATABASE_URL not set — skipping.'); process.exit(0); }
    #
    # Measured: this same loop with the guard removed and DATABASE_URL unset prints two
    # green ticks and exits 0. That is ENG-526 rebuilt — a job reporting success forever
    # while checking nothing, which is worse than no job and is the exact failure ENG-666
    # exists to stop. The guard exits 127 before npm starts and names the variable.
    #
    # A loop rather than `&&`, because `&&` stops at the first failure and this job's
    # whole value is reporting everything it found in the run a person is looking at.
    startCommand: >-
      : "${DATABASE_URL:?is not set — refusing to report a pass}" ;
      rc=0 ;
      for s in check:gated check:db-security check:dead-letters ; do echo "── $s" ; npm run --silent "$s" || rc=1 ; done ;
      exit $rc
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: huddle-shared
      # - key: INGEST_PAUSED_UNTIL
      #   value: 2026-08-02T18:00:00Z   # uncomment + set while ingestion is suspended

  # ── huddle-api-audit (Cron — API invariants, daily) ──────
  # A second service only because the repo boundary forces one. A Render cron checks out
  # one repo, and these three scripts live in huddle-api, so they cannot run from the
  # huddle-engine service above however much one would prefer a single job.
  #
  # Daily rather than */15, and here the cadence argument does hold: this is a new email
  # stream either way, so its rate is a real choice. All three assert invariants whose
  # answer cannot change without a commit, a migration, or a slow drift in row counts —
  # none of which move on a fifteen-minute clock. Daily costs at most 24h of latency on
  # a defect that needs a human commit to clear.
  #
  # Green against production 2026-08-11, all three:
  #   schema-drift   128 select sites and 329 filter/order columns all resolve
  #   row-cap        30 unbounded sites, none over the 1000-row cap; 10 baselined, all live
  #   surface        43 probes, every one returning usable rows; 7 baselined, 1 unrunnable
  #
  # row-cap and surface both go red with no commit anywhere, which is the case for a
  # scheduler rather than CI. row-cap compares code against live row counts, and `events`
  # at 11,706 and `player_game_stats` at 230,780 say which way those move — the next
  # relation to cross 1,000 fails this job on its own. surface re-seeds from the live board
  # every run and asserts the rows are actually usable, which is the gap ENG-669 names.
  #
  # schema-drift is the opposite shape and still belongs here: both its inputs are
  # artefacts, but one of them is a migration in the supabase repo that this repo's CI
  # never sees.
  #
  # surface is the flappiest of the three, and it was red this morning — GET
  # /api/v1/game-log/h2h returned nothing until ENG-697 landed at 08:28 and fixed the seed.
  # It is in because it is green on the current master, not because it is quiet. When it
  # goes red for a reason that is the board rather than the code, the answer is a
  # .surface-baseline.json entry naming a measurement — the mechanism the check already
  # has — and not dropping it from this line.
  #
  # Not scheduled, each with a reason:
  #   check:rls              creates three real auth.users accounts and updates profiles and
  #                          profile_reputation on every run, cleaning up in afterAll. A run
  #                          that dies mid-suite leaves that in production, and unattended is
  #                          exactly when it will. Needs a non-production target (ENG-443).
  #   check:deep-link-drift  compares this repo against huddle-client on disk. A cron checks
  #                          out one repo, so it would exit 1 every run for the wrong reason.
  #   check:types-fresh      exits 0 when DATABASE_URL is absent. ENG-526. Not until it fails
  #                          loud the way the three scheduled below do.
  #   check:probe-routes     static and single-repo. CI already gates it.
  - type: cron
    name: huddle-api-audit
    runtime: node
    region: oregon
    plan: starter
    repo: https://github.com/huddle-bet/huddle-api
    schedule: "40 13 * * *"
    buildCommand: npm install
    # All three scripts already fail loud on a missing credential, in these words:
    #   "This is a failure, not a skip — a check that silently does nothing reads as a pass."
    # The guard is here anyway. It costs nothing, it names the two variables this job is
    # useless without, and it means the loop shape is identical in both audit crons rather
    # than depending on which scripts happen to guard themselves this week.
    startCommand: >-
      : "${SUPABASE_URL:?is not set — refusing to report a pass}" ;
      : "${SUPABASE_SERVICE_KEY:?is not set — refusing to report a pass}" ;
      rc=0 ;
      for s in check:schema-drift check:row-cap check:surface ; do echo "── $s" ; npm run --silent "$s" || rc=1 ; done ;
      exit $rc
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: huddle-shared

  # ── huddle-data has no audit cron, and that is a decision ─
  # `check:conflict-targets` earns one on every measure that matters: 0.48s, green at
  # 25/25 on 2026-08-11, and it fails loud twice over — exit 2 on a missing DATABASE_URL
  # and exit 2 again if its regex parses zero targets, so it cannot pass vacuously. It
  # guards a defect that presents as `0 written`, indistinguishable from a healthy quiet
  # batch, and that has cost two total write failures in a week.
  #
  # The obstacle is the repo, not the check. huddle-data ships as Docker with playwright,
  # cycletls and a Go replay parser, so a cron there pays a full image build to run a
  # half-second query. Its two inputs are src/db/writer.ts and pg_index — one commit in
  # huddle-data, one migration in supabase — so a migration-triggered CI job with a
  # database is the better home than a timer. Same for check:orphans and check:unresolved,
  # which additionally exit 0 on a missing DATABASE_URL and would need the guard above.
  # Left open on ENG-666 rather than solved badly here.

  # ── huddle-live (Web Service — exposes fanout WS) ─────────
  # Flipped from worker → web so huddle-api can open an internal WS to
  # /fanout. Realtime broadcast was the #1 Supabase message-cost driver;
  # this replaces it with a direct service-to-service WS. Auth via
  # HUDDLE_INTERNAL_SECRET header — not meant for browser clients.
  #
  # Plan: standard (1 CPU / 2 GB) — required by the headless Chromium
  # scorebot transport. With per-context memory tuned to ~100-130MB
  # (resource blocking + --max-old-space-size=192) the worker fits 5-7
  # concurrent CS2 matches plus the base node process under 2GB. Polling
  # transport alone runs comfortably on starter; standard is sized for
  # HLTV_TRANSPORT=headless. Drop back to starter if reverting.
  - type: web
    name: huddle-live
    runtime: node
    region: oregon
    plan: standard
    repo: https://github.com/huddle-bet/huddle-live
    # Explicitly run `playwright install` after npm install. The package's
    # postinstall hook normally handles this, but if it ever silently
    # fails the headless transport crashes on launch with "Executable
    # doesn't exist" — observed 2026-04-29 16:52 UTC. Belt-and-suspenders.
    buildCommand: npm install && npx playwright install chromium --only-shell
    startCommand: node --import tsx src/cli.ts watch --all
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8081"
      # Memory canary cap for the headless transport's per-minute
      # `[headless-scorebot] mem rss=...` log. Keep aligned with the
      # service plan's actual RAM ceiling.
      - key: PLAN_RAM_MB
        value: "2048"
      # Note: PLAYWRIGHT_BROWSERS_PATH=0 is defaulted in code (see
      # headless-scorebot-client.ts top-of-file). Render's build artifact
      # preserves node_modules but not ~/.cache, so browsers must live
      # inside the project directory to survive build → runtime. Set this
      # env here only to override (e.g. external browser cache mount).
      # huddle-live no longer hits FlareSolverr — the polling scorebot
      # and matches-harvester both go via cycletls + residential proxy.
      # FLARESOLVERR_URL is inherited from the shared group but unused.
      - fromGroup: huddle-shared

  # ── FlareSolverr (Private Service — pre-built image) ──────
  # Cloudflare JS-challenge solver. Sole remaining caller is huddle-data's
  # CS2 backfill — specifically the /stats/matches/mapstatsid/* path,
  # which CF gates more strictly than the rest of www.hltv.org and
  # rejects cycletls + JA3 + cookies. All other HLTV traffic (live
  # ingest, /matches harvest, /results, match detail) now goes through
  # cycletls and never touches this service.
  #
  # pserv = private service, no external ingress. Only reachable from
  # other Render services in the same workspace via http://flaresolverr-qrfy:8191.
  #
  # The -qrfy suffix is not decoration. Render appends one when the requested
  # service name is already taken globally, and it becomes part of the private
  # DNS name. `flaresolverr` alone does not resolve. The dashboard also reports
  # this service's url as `flaresolverr-qrfy:10000`; 10000 is not the port to
  # use, 8191 is — that is what the container listens on and what
  # FLARESOLVERR_URL is set to (ENG-689).
  #
  # runtime=image + image.url pulls the official upstream build.
  #
  # Standard plan (2 CPU / 4 GB) — Byparr's Camoufox/Firefox stack is
  # heavier per-solve than the prior FlareSolverr/Chromium image. On
  # starter (0.5 CPU / 512 MB) Playwright Page.goto routinely times out
  # at 47-60s on HLTV's CF challenge during normal reconcile load,
  # silently degrading ~24-28% of CS2 maps to sentinel-only (no per-
  # player stats). Headroom is the fix; see render-data + reconciler
  # observability for the silent-failure rate that drove this bump.
  - type: pserv
    name: flaresolverr
    runtime: docker
    region: oregon
    plan: standard
    # Migrated 2026-04-28 from upstream FlareSolverr (vanilla Chromium,
    # effectively unmaintained) to Byparr — FlareSolverr-API-compatible
    # REST backed by Camoufox (patched Firefox with C-level anti-
    # fingerprint). Different browser stack from any Chromium variant.
    #
    # We wrap Byparr's image with a tiny entrypoint at byparr-wrapper/
    # that auto-derives Byparr's PROXY_SERVER / PROXY_USERNAME /
    # PROXY_PASSWORD from the Webshare list (WEBSHARE_PROXY_LIST_URL,
    # falling back to the FLARESOLVERR_PROXY_URL CSV). Picks the first
    # entry deterministically so this container's egress IP matches the
    # one huddle-data's cycletls process pins to — required for
    # cf-session cache reuse, since cf_clearance is bound to source IP.
    #
    # Service name kept as 'flaresolverr' so FLARESOLVERR_URL doesn't
    # need to change across consumers. Revert: change runtime back to
    # image / image.url, remove BYPARR_MODE on huddle-data.
    repo: https://github.com/huddle-bet/huddle-core
    dockerfilePath: ./byparr-wrapper/Dockerfile
    dockerContext: ./byparr-wrapper
    envVars:
      - key: PORT
        value: "8191"
      # Inherits WEBSHARE_PROXY_LIST_URL and FLARESOLVERR_PROXY_URL — the
      # entrypoint fetches the former, falls back to the latter, and exports
      # PROXY_SERVER / PROXY_USERNAME / PROXY_PASSWORD before launching Byparr.
      - fromGroup: huddle-shared
